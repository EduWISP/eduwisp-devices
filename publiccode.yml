description:
  it:
    shortDescription: "EduWISP — Gestione dispositivi (MDM)"
    longDescription: "Inventario, ciclo di vita, provisioning e comandi remoti dei dispositivi gestiti, **indipendente dalla piattaforma**: le funzioni specifiche (oggi Android) arrivano dagli agenti tramite `eduwisp-protocol`. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è in fase di progettazione e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.github.io/docs/"
    documentation: "https://eduwisp.github.io/docs/"
    features:
      - "Gestione dispositivi (MDM)"
  en:
    shortDescription: "EduWISP — Device management (MDM)"
    longDescription: "Inventory, lifecycle, provisioning and remote commands for managed devices, **platform-independent**: platform-specific features (Android first) come from agents via `eduwisp-protocol`. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in the design phase and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.github.io/docs/en/"
    documentation: "https://eduwisp.github.io/docs/en/"
    features:
      - "Device management (MDM)"

